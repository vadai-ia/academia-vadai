<!doctype html>
<html lang="es" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<!-- v3 · styleframes de «La interfaz viva»: cada segundo es un cuadro fijo (0–7). Solo para revisión. -->
<script>
  window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
  window.__hf.buildReady["estilos"] = new Promise((ok, mal) => { window.__ok = ok; window.__mal = mal; });
</script>
<script src="./vendor/gsap/gsap.min.js"></script>
<link rel="stylesheet" href="./estilo/tokens.css" />
<style>
  @font-face { font-family: "Anton"; src: url("./assets/fonts/Anton-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "Inter"; src: url("./assets/fonts/Inter-Variable.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1088px; height: 1920px; overflow: hidden; background: #0A1A2F; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0A1A2F; }
  #gl, #ui { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1088" data-height="1920" data-fps="30">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="ui" class="clip" data-start="0" data-duration="3" data-track-index="1"></div>
</div>
<script>
  const tl = gsap.timeline({ paused: true }); tl.set({}, {}, 3); window.__tl = tl; window.__timelines["main"] = tl;
</script>
<script type="module">
  import { crearVidrio } from "./v3/vidrio.js";
  import { montarV as montar } from "./v3/estilos.js";
  import { CHISPA_SVG } from "./estilo/ui.js";
  (async () => {
    await document.fonts.load('200px "Anton"'); await document.fonts.load('800 30px "Inter"');
    const chispa = CHISPA_SVG().match(/ d="([^"]+)"/)[1];
    const V = crearVidrio(document.getElementById("gl"), 1080, 1920);
    const E = montar({ ui: document.getElementById("ui"), W: 1080, H: 1920, chispa });
    await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
    const pintar = (t) => {
      const k = Math.min(E.cuadros.length - 1, Math.max(0, Math.floor(t)));
      E.mostrar(k);
      const q = E.cuadros[k], m = V.mascara; m.clearRect(0, 0, V.w, V.h); m.fillStyle = "#fff"; m.strokeStyle = "#fff";
      if (q.vidrioGL) q.vidrioGL(m, V.escala);
      V.pintar(t, { aurora: q.aurora, tinte: k === 2 ? 0.3 : 0.28, realce: 0.05, colorVidrio: "#EAF4FA" });
    };
    const R = { t: 0 }; tl.fromTo(R, { t: 0 }, { t: 3, duration: 3, ease: "none", modifiers: { t: (v) => { pintar(+v); return v; } } }, 0);
    window.addEventListener("hf-seek", (e) => pintar(e.detail.time));
    pintar(0);
  })().then(window.__ok, (e) => { console.error("estilos:", e); window.__mal(e); });
</script>
</body>
</html>
